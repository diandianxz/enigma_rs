name: Build enigma-rs
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-pc-windows-msvc

      - name: Build
        run: cargo build --release --target i686-pc-windows-msvc --no-default-features

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: enigma-rs-cpu
          path: target/i686-pc-windows-msvc/release/enigma-rs.exe
